# JUL (java.util.logging) 配置文件
# 根日志器级别：INFO
.level=INFO

# 处理器配置：控制台 + 文件
handlers=java.util.logging.ConsoleHandler, java.util.logging.FileHandler

# ==================== 控制台处理器 ====================
java.util.logging.ConsoleHandler.level=INFO
java.util.logging.ConsoleHandler.formatter=java.util.logging.SimpleFormatter
# 日志格式：时间 [级别] 类名 - 消息
java.util.logging.SimpleFormatter.format=%1$tH:%1$tM:%1$tS.%1$tL [%4$-7s] %2$s - %5$s%6$s%n

# ==================== 文件处理器 ====================
java.util.logging.FileHandler.level=INFO
# 日志文件路径：~/logs/back-tool-%u-%g.log (%u=唯一编号, %g=生成序号)
java.util.logging.FileHandler.pattern=%h/logs/back-tool-%u-%g.log
# 单个文件大小限制：50MB
java.util.logging.FileHandler.limit=50000000
# 文件数量限制：30个
java.util.logging.FileHandler.count=30
# 追加模式（不覆盖）
java.util.logging.FileHandler.append=true
# 使用与控制台相同的格式化器
java.util.logging.FileHandler.formatter=java.util.logging.SimpleFormatter

# ==================== 包级别日志控制 ====================
# 项目代码：INFO级别
backtool.level=INFO

# 第三方库：只记录WARNING及以上
org.apache.commons.level=WARNING
javafx.level=WARNING
